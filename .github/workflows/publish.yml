name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build, test, and validate the package without publishing
        type: boolean
        default: true
        required: true

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
      RELEASE_TAG: ${{ github.event.release.tag_name || github.ref_name }}
      PRERELEASE: ${{ github.event.release.prerelease || false }}
    steps:
      - name: Check out release
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Mount disposable Scratch storage
        run: |
          sudo mkdir -p /Volumes/Scratch
          sudo mount -t tmpfs -o size=2G tmpfs /Volumes/Scratch
          sudo chown "$(id -u):$(id -g)" /Volumes/Scratch
          mkdir -p /Volumes/Scratch/sloth-vdf/tmp /Volumes/Scratch/sloth-vdf/npm-cache
          echo 'TMPDIR=/Volumes/Scratch/sloth-vdf/tmp' >> "$GITHUB_ENV"
          echo 'NPM_CONFIG_CACHE=/Volumes/Scratch/sloth-vdf/npm-cache' >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.19.1

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          run_install: false
          cache: false

      - name: Check release version and select npm tag
        id: release
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';
          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (name !== '@0xdoublesharp/sloth-vdf') throw new Error('Unexpected package name');
          if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(version)) {
            throw new Error('Invalid package version');
          }
          if (process.env.DRY_RUN !== 'true' && process.env.RELEASE_TAG !== `v${version}`) {
            throw new Error(`Release tag must match package.json: expected v${version}`);
          }
          const prerelease = version.split('+')[0].includes('-') || process.env.PRERELEASE === 'true';
          appendFileSync(process.env.GITHUB_OUTPUT, `dist_tag=${prerelease ? 'next' : 'latest'}\n`);
          appendFileSync(process.env.GITHUB_OUTPUT, `filename=0xdoublesharp-sloth-vdf-${version}.tgz\n`);
          NODE

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
        with:
          version: v1.8.5
          cache: false

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests and check coverage
        run: |
          pnpm test
          pnpm coverage

      - name: Build publishable tarball
        id: package
        env:
          FILENAME: ${{ steps.release.outputs.filename }}
        run: |
          pnpm run pack
          node --input-type=module <<'NODE'
          import { spawnSync } from 'node:child_process';
          import { appendFileSync, existsSync, readFileSync, writeFileSync } from 'node:fs';
          import { join } from 'node:path';
          import { build } from './scripts/paths.mjs';
          let filename = process.env.FILENAME;
          if (process.env.DRY_RUN === 'true') {
            const staging = join(build, 'package');
            const manifestPath = join(staging, 'package.json');
            const manifest = JSON.parse(readFileSync(manifestPath, 'utf8'));
            const version = manifest.version.split('+')[0];
            const run = process.env.GITHUB_RUN_ID || Date.now().toString();
            const attempt = process.env.GITHUB_RUN_ATTEMPT || '1';
            manifest.version = `${version}${version.includes('-') ? '.' : '-'}dry-run.${run}.${attempt}`;
            writeFileSync(manifestPath, `${JSON.stringify(manifest, null, 2)}\n`);
            const packed = spawnSync('pnpm', ['pack', '--pack-destination', join(build, 'packages')], {
              cwd: staging, env: process.env, stdio: 'inherit',
            });
            if (packed.error) throw packed.error;
            if (packed.status !== 0) throw new Error('Dry-run packaging failed');
            filename = `0xdoublesharp-sloth-vdf-${manifest.version}.tgz`;
          }
          const tarball = join(build, 'packages', filename);
          if (!existsSync(tarball)) throw new Error(`Missing package: ${tarball}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `tarball=${tarball}\n`);
          NODE

      - name: Validate npm publish without releasing
        if: env.DRY_RUN == 'true'
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
          DIST_TAG: next
        run: npm publish "$TARBALL" --dry-run --access public --tag "$DIST_TAG" --ignore-scripts

      - name: Publish to npm with OIDC and provenance
        if: env.DRY_RUN != 'true'
        env:
          TARBALL: ${{ steps.package.outputs.tarball }}
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
        run: npm publish "$TARBALL" --access public --tag "$DIST_TAG" --provenance --ignore-scripts
